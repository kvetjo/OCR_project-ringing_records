    - Flag_Reason: if Confidence is NOT "Top-certain", briefly describe the ambiguity or legibility issue (e.g., "ambiguous digit 5 or 7 in Number", "unclear first letter in Name", or other reasons - it is up to you). Do NOT flag any issues found in the Remarks column. If Confidence is "Top-certain", return an empty string "".
